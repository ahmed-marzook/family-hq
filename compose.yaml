# Family HQ stack.
#
# family-hq (our Rust server), GOWA (the WhatsApp bridge) and a webhook echo
# server for experimenting until family-hq has its own webhook (Stage 1.4).
#
# Setup: copy `.env.example` to `.env` and fill it in. See docs/GOWA.md.

services:
  family-hq:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The same secret GOWA signs webhooks with, so we can check them.
      GOWA_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:?set GOWA_WEBHOOK_SECRET in .env}
      # How family-hq calls GOWA (to react, and later to reply). Inside
      # Compose it's the service name and GOWA's own port, not 3001.
      GOWA_URL: http://gowa:3000
      GOWA_BASIC_AUTH: ${GOWA_BASIC_AUTH:?set GOWA_BASIC_AUTH in .env}
      # Defaults for chats that haven't set their own (`/settings ...`).
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/London}
      DEFAULT_CITY: ${DEFAULT_CITY:-Milton Keynes}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-GB}
      DEFAULT_PRAYER_METHOD: ${DEFAULT_PRAYER_METHOD:-3}    # 3 = Muslim World League
      DEFAULT_PRAYER_SCHOOL: ${DEFAULT_PRAYER_SCHOOL:-0}    # Asr: 0 = Shafi'i, 1 = Hanafi
      DEFAULT_PRAYER_ENDING_MINUTES: ${DEFAULT_PRAYER_ENDING_MINUTES:-20}
      # Days without using the bot before a person's (or group's) data is
      # cleared, after a warning. 0 = never. See src/cleanup.rs.
      INACTIVE_DAYS: ${INACTIVE_DAYS:-14}
    volumes:
      # The SQLite database (DATABASE_URL in the Dockerfile points here).
      # A named volume survives `docker compose down` and rebuilds.
      - family_hq_data:/data

  # The admin dashboard: serves the React app and passes /api to family-hq.
  admin:
    build: ./web
    restart: unless-stopped
    depends_on:
      - family-hq
    ports:
      # Bound to localhost by default; set ADMIN_BIND=0.0.0.0 in .env to reach
      # it from another machine.
      - "${ADMIN_BIND:-127.0.0.1}:8080:8080"

  gowa:
    # Pinned so an upstream release can't change the webhook payload under us.
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.7.0
    restart: unless-stopped
    command: ["rest"]
    ports:
      # GOWA listens on 3000 inside the container. On the host it's 3001,
      # because family-hq uses 3000. Bound to localhost by default;
      # set GOWA_BIND=0.0.0.0 in .env to reach it from another machine.
      - "${GOWA_BIND:-127.0.0.1}:3001:3000"
    environment:
      APP_OS: FamilyHQ # name shown under "Linked devices" on the phone
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:?set GOWA_BASIC_AUTH in .env}
      WHATSAPP_WEBHOOK: ${GOWA_WEBHOOK_URL:-http://webhook-echo:8080/webhook/whatsapp}
      WHATSAPP_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:?set GOWA_WEBHOOK_SECRET in .env}
      # Only the events Phase 1 uses: messages (incl. replies) and reactions.
      # Remove this line to see every event type while experimenting.
      WHATSAPP_WEBHOOK_EVENTS: message,message.reaction
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "false"
      TZ: Europe/London
    volumes:
      # The WhatsApp session lives here. Losing it means pairing again.
      - gowa_storages:/app/storages
      - gowa_statics:/app/statics

  # Logs every request it receives (headers + JSON body), so you can see
  # exactly what GOWA sends before family-hq has a webhook endpoint.
  # Watch it with: docker compose logs -f webhook-echo
  webhook-echo:
    image: mendhak/http-https-echo:43
    restart: unless-stopped
    environment:
      LOG_IGNORE_PATH: /health

volumes:
  family_hq_data:
  gowa_storages:
  gowa_statics:
