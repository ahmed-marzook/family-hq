# Claude works on an issue and opens a PR for it, when the repo owner:
#   * labels an issue `claude-ready`,
#   * assigns an issue to the account in the CLAUDE_ASSIGNEE repo variable, or
#   * mentions @claude in an issue or PR comment, or a PR review comment.
#
# Only the owner can trigger it, so nobody else can spend the Claude usage.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`) and the
# Claude GitHub App installed on the repo. Its pushes and PRs come from the
# App, so they do trigger CI and the review (a GITHUB_TOKEN push wouldn't).

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# One run per issue or PR at a time; a second request waits for the first.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'claude-ready') ||
        (github.event_name == 'issues' && github.event.action == 'assigned' &&
          vars.CLAUDE_ASSIGNEE != '' &&
          github.event.assignee.login == vars.CLAUDE_ASSIGNEE)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A real, migrated database, so the SQLx macros check new queries and
      # `cargo sqlx prepare` can refresh .sqlx/. CI itself builds offline.
      DATABASE_URL: sqlite:/tmp/agent.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: |
          command -v sqlx >/dev/null ||
            cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite

      - name: Create the database
        run: cargo sqlx database setup

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-ready
          assignee_trigger: ${{ vars.CLAUDE_ASSIGNEE }}
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*),Bash(cargo check:*),Bash(cargo sqlx prepare:*),Bash(cargo sqlx migrate:*),Bash(npm ci:*),Bash(npm run build:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "Follow CLAUDE.md, especially its Agent workflow section. Check docs/ROADMAP.md for the current stage; if the issue asks for a later-phase feature, say so on the issue instead of building it. Keep the change small and focused on this one issue. Before pushing, run cargo fmt --check, cargo clippy --all-targets -- -D warnings and cargo test; run npm ci and npm run build in web/ if anything under web/ changed; if any SQL query changed, run cargo sqlx prepare -- --all-targets and commit .sqlx/. When working on an issue, push your branch and open the PR yourself with gh pr create, with a body that starts with 'Closes #<issue number>' and says what changed and how it was tested. When asked to fix review findings on an existing PR, push to that PR's branch."
