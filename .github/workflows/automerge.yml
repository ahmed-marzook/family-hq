# Turns on auto-merge for Claude's PRs, so they merge on their own once the
# required checks on main pass. Done here rather than by Claude itself, so it
# doesn't depend on the model remembering to and costs no Claude usage.
#
# Auto-merge is enabled with the owner's PROJECT_TOKEN, so the merge counts
# as the owner's. With GITHUB_TOKEN the merge is github-actions', and GitHub
# then neither closes the issue the PR says it closes nor runs CI on main
# (#42 left #7 open that way). GITHUB_TOKEN is only the fallback.
#
# Needs "Allow auto-merge" in Settings → General, and branch protection on
# main requiring `checks`; without a required check, auto-merge would merge
# at once.
#
# Off unless the repo variable AUTOMERGE is `true` (Settings → Secrets and
# variables → Actions → Variables). Turned off because only `checks` is
# required: #52 merged a minute after opening, with the Claude review's
# findings still open and nothing set up to fix them. The owner merges by
# hand until the review gates the merge.

name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Claude's PRs: opened by the Claude GitHub App, or from one of its
    # `claude/` branches (the "Create PR" link, or scripts/claude-local.sh).
    # Same-repo only, so a fork can't name its branch `claude/...` to get in.
    if: |
      vars.AUTOMERGE == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository && (
        github.event.pull_request.user.login == 'claude[bot]' ||
        startsWith(github.event.pull_request.head.ref, 'claude/')
      )
    runs-on: ubuntu-latest
    steps:
      # A GraphQL call rather than `gh pr merge --auto`, which can insist on
      # token scopes (read:org) the PAT doesn't need for this.
      - run: |
          gh api graphql -f pr="$PR_ID" -f query='
            mutation($pr: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: SQUASH }) {
                pullRequest { number }
              }
            }'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_ID: ${{ github.event.pull_request.node_id }}
